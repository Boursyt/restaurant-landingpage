kind: pipeline
name: hugo-website

# This anchor is now less useful, but we'll keep it for this fix.
hugo_env: &hugo_env
   BASE_BUCKET_URL: $BUCKET_URL

steps:
  - name: hugo-build
    image: peaceiris/hugo:v0.65.3-mod
    environment:
      <<: *hugo_env
      # This is the missing piece for the build step
      BUCKET_URL:
        from_secret: bucket_url
    commands:
      # Now $BASE_BUCKET_URL (via $BUCKET_URL) will have the correct value
      - hugo --baseURL $BASE_BUCKET_URL

  - name: deploy-to-s3
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      BUCKET_URL:
        from_secret: bucket_url
    commands:
      - aws s3 sync ./public $BUCKET_URL --delete --exact-timestamps --acl public-read

trigger:
  branch:
    - master
  event:
    - push