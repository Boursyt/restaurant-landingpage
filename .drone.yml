# 1. Pipeline de PREVIEW (inchangé)
# Se déclenche sur un push vers n'importe quelle branche SAUF master.
kind: pipeline
name: preview

trigger:
  event:
    - push
  branch:
    exclude:
      - master

steps:
  - name: hugo-build-preview
    image: peaceiris/hugo:v0.65.3-mod
    environment:
      BASE_URL: http://preview.example.com/resto/${DRONE_COMMIT_SHA:0:7}/
    commands:
      - hugo --baseURL $BASE_URL

  - name: deploy-to-s3-preview
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      S3_URI_PREVIEW:
        from_secret: s3_uri_preview
    commands:
      - aws s3 sync ./public $S3_URI_PREVIEW/resto/${DRONE_COMMIT_SHA:0:7} --delete

---
# 2. Pipeline de BUILD ET ARCHIVAGE
# Se déclenche sur chaque push vers master.
# Construit le site PUIS archive le résultat comme "release" sur S3.
kind: pipeline
name: build-and-archive-master

trigger:
  event:
    - push
  branch:
    - master

steps:
  - name: hugo-build
    image: peaceiris/hugo:v0.65.3-mod
    environment:
      # On build avec une URL générique, car cet artefact sera utilisé partout
      BUCKET_PROD_URL:
        from_secret: bucket_url
    commands:
      - hugo --baseURL $BUCKET_PROD_URL

  - name: archive-and-upload-release
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      S3_URI_RELEASES: # NOUVEAU SECRET pour le bucket des artefacts
        from_secret: s3_uri_release
    commands:
      # L'image amazon/aws-cli ne contient pas zip par défaut, on l'installe
      - yum install -y zip
      - echo "Archiving ./public directory..."
      - zip -r release.zip ./public
      - echo "Uploading release artifact to S3..."
      - aws s3 cp release.zip $S3_URI_RELEASES/resto/${DRONE_COMMIT_SHA:0:7}.zip

---
# 3. Pipeline de STAGING (par PROMOTION depuis S3)
# Récupère l'artefact depuis S3 et le déploie.
kind: pipeline
name: deploy-staging

trigger:
  event:
    - promote
  target:
    - staging

steps:
  - name: download-release-artifact
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      S3_URI_RELEASES:
        from_secret: s3_uri_release
    commands:
      - yum install -y unzip
      - echo "Downloading release for commit ${DRONE_COMMIT_SHA:0:7}..."
      - aws s3 cp $S3_URI_RELEASES/resto/${DRONE_COMMIT_SHA:0:7}.zip release.zip
      - echo "Unzipping artifact..."
      - unzip release.zip

  - name: deploy-to-s3-staging
    image: amazon/aws-cli
    depends_on: # S'assure que le téléchargement est terminé avant de se lancer
      - download-release-artifact
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      S3_URI_STAGING:
        from_secret: s3_uri_staging
    commands:
      - aws s3 sync ./public $S3_URI_STAGING --delete --exact-timestamps

---
# 4. Pipeline de PRODUCTION (par PROMOTION depuis S3)
# Récupère le MÊME artefact depuis S3 et le déploie.
kind: pipeline
name: deploy-production

trigger:
  event:
    - promote
  target:
    - production

steps:
  - name: download-release-artifact
    image: amazon/aws-cli
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      S3_URI_RELEASES:
        from_secret: s3_uri_release
    commands:
      - yum install -y unzip
      - echo "Downloading release for commit ${DRONE_COMMIT_SHA:0:7}..."
      - aws s3 cp $S3_URI_RELEASES/resto/${DRONE_COMMIT_SHA:0:7}.zip release.zip
      - echo "Unzipping artifact..."
      - unzip release.zip

  - name: deploy-to-s3-production
    image: amazon/aws-cli
    depends_on:
      - download-release-artifact
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: aws_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: aws_secret_access_key
      AWS_SESSION_TOKEN:
        from_secret: aws_session_token
      AWS_DEFAULT_REGION:
        from_secret: aws_region
      S3_URI_PROD:
        from_secret: s3_uri
    commands:
      - aws s3 sync ./public $S3_URI_PROD --delete --exact-timestamps